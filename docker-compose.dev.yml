# Local development stack: every feature on, code mounted, no rebuilds.
#
#   docker compose -f docker-compose.dev.yml up
#
# The default docker-compose.yml is the deploy shape (Coolify and CI:
# baked weights, no mounts). This file is for iterating locally:
# uvicorn reloads on edits under ./src, and every feature is configured
# through the environment block below. All names read from .env
# (compose interpolation and env_file both pick it up).
#
# Feature checklist (curl http://localhost:8000/health):
#   face / verify   — always on (weights are baked into the image)
#   attributes      — always on (FairFace weights are baked in)
#   antispoof       — always on (MiniFASNet weights are baked in)
#   ocr / mrz       — always on (weights are baked into the image)
#   structured      — the bundled local llama.cpp server (service `llm`)
#                     by default; override with BLITZID_LLM_BASE_URL /
#                     BLITZID_LLM_API_KEY / BLITZID_LLM_MODEL (vLLM,
#                     router.requesty.ai, ...). Unset those in .env to
#                     use the local model.
#   consistency     — same config as structured
#   tracing         — needs the LANGFUSE_* trio (spans carry OCR text)
# The `llm` service runs llama.cpp (CPU) serving LiquidAI
# LFM2.5-2.6B-Q4_0.gguf, downloaded from Hugging Face on first start
# into ./models/llm (persistent; gitignored). Playground / web UI at
# http://localhost:17847, OpenAI-compatible endpoint at /v1.
# The API's own OpenAPI docs need no config and are always on:
# http://localhost:8000/docs (schema at /openapi.json).
services:
  api:
    build: .
    image: blitzid:dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BLITZID_API_REDIS_URL: redis://redis:6379/0
      BLITZID_MODELS_DIR: /models
      # OpenAI-compatible chat endpoint for structured extraction and
      # the consistency cross-check. Defaults to the bundled local
      # llama.cpp server (service `llm`); anything set in .env wins.
      BLITZID_LLM_BASE_URL: ${BLITZID_LLM_BASE_URL:-http://llm:8080/v1}
      BLITZID_LLM_API_KEY: ${BLITZID_LLM_API_KEY:-local}
      BLITZID_LLM_MODEL: ${BLITZID_LLM_MODEL:-lfm2.5-2.6b-q4_0}
      # Langfuse tracing of the LLM calls (off while unset).
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      # Queue knobs (defaults shown).
      BLITZID_API_MAX_UPLOAD_MB: ${BLITZID_API_MAX_UPLOAD_MB:-20}
      BLITZID_API_JOB_TTL_SECONDS: ${BLITZID_API_JOB_TTL_SECONDS:-900}
      BLITZID_API_MAX_QUEUED_JOBS: ${BLITZID_API_MAX_QUEUED_JOBS:-50}
      BLITZID_API_MAX_CONCURRENT_JOBS: ${BLITZID_API_MAX_CONCURRENT_JOBS:-2}
      BLITZID_API_JOB_LEASE_SECONDS: ${BLITZID_API_JOB_LEASE_SECONDS:-120}
    command:
      ["uvicorn", "blitzid.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      # Hot code: the project is installed editable, so edits under
      # ./src are picked up without rebuilding the image.
      - ./src:/app/src
      # Share one weight cache with the host instead of the baked
      # /models. A fresh ./models holds no weights, so the first start
      # downloads ~260 MB before /health answers (start_period covers it).
      - ./models:/models
    depends_on:
      redis:
        condition: service_healthy
      llm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
  llm:
    # llama.cpp server, CPU build, serving the LiquidAI LFM 2.5 2.6B Q4_0
    # GGUF. The model is downloaded from Hugging Face on first start into
    # the ./models/llm bind mount and reused on later starts (no
    # re-download once the file exists).
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      # Uncommon host port to avoid clashes with the usual 8080 users;
      # the container keeps the image default so its baked healthcheck
      # (curl on 8080) stays valid.
      - "17847:8080"
    environment:
      # -m target inside the mounted /llm-models dir; llama.cpp downloads
      # the HF file there when it is missing, then loads it from there.
      LLAMA_ARG_MODEL: /llm-models/LFM2.5-2.6B-Q4_0.gguf
      LLAMA_ARG_HF_REPO: LiquidAI/LFM2.5-2.6B-GGUF
      LLAMA_ARG_HF_FILE: LFM2.5-2.6B-Q4_0.gguf
      # CPU-only: the server image has no CUDA build, 0 is explicit.
      LLAMA_ARG_N_GPU_LAYERS: "0"
      LLAMA_ARG_CTX_SIZE: "8192"
      # Stable name served via /v1/models and expected by BLITZID_LLM_MODEL.
      LLAMA_ARG_ALIAS: lfm2.5-2.6b-q4_0
      # The image already sets LLAMA_ARG_HOST=0.0.0.0 and port 8080.
    volumes:
      # Persistent model cache (gitignored); mounted apart from the api
      # service's /models so the two never share one directory.
      - ./models/llm:/llm-models
    restart: unless-stopped
    healthcheck:
      # Same probe the image bakes in; redeclared only to give the first
      # start (download + load) a generous start_period.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
  redis:
    image: redis:8-alpine
    # Persistence off: jobs live in RAM only — nothing ever reaches disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
