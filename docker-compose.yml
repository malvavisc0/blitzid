services:
  api:
    build: .
    # For released tags, build from the published GHCR image instead:
    # image: ghcr.io/malvavisc0/blitzid:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BLITZID_API_REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      - redis
    # Optional: mount local weights over the baked /models directory.
    # volumes:
    #   - ./models:/models
  redis:
    image: redis:8-alpine
    # Persistence off: jobs live in RAM only — nothing ever reaches disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
