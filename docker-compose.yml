services:
  api:
    build: .
    # Compose tags the locally built image with this name (defaults to
    # :latest); CI sets BLITZID_IMAGE_TAG to the release tag so the
    # smoke test runs the exact image it is about to push. Released
    # tags can skip the build and run the published image instead:
    #   docker compose up --no-build
    # after `docker pull ghcr.io/malvavisc0/blitzid:latest`.
    image: ghcr.io/malvavisc0/blitzid:${BLITZID_IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BLITZID_API_REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      - redis
    # Optional: mount local weights over the baked /models directory.
    # volumes:
    #   - ./models:/models
  redis:
    image: redis:8-alpine
    # Persistence off: jobs live in RAM only — nothing ever reaches disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
