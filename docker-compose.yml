# Deployment stack for Coolify and plain Docker. The image bakes every
# engine's weights (SCRFD, ArcFace, FairFace, MiniFASNet, RapidOCR) and
# installs every runtime feature (face detection, face verification,
# face attributes, face anti-spoofing, OCR, MRZ, structured
# extraction, tracing), so cold start is instant and this file only
# wires runtime configuration.
#
# Coolify: point the service at this file and set these in its
# environment tab — BLITZID_LLM_BASE_URL, BLITZID_LLM_API_KEY,
# BLITZID_LLM_MODEL (required by the `structured` engine; /health shows
# it). Optional: the LANGFUSE_* trio to trace the LLM calls (spans
# carry OCR text, so point it at infrastructure you trust) and the
# BLITZID_API_* queue knobs below. Plain `docker compose up` reads the
# same names from .env.
#
# CI sets BLITZID_IMAGE_TAG to the release tag so the smoke test runs
# the exact image it is about to push. Released tags can skip the build
# and run the published image instead:
#   docker compose up --no-build
# after `docker pull ghcr.io/malvavisc0/blitzid:latest`.
services:
  api:
    image: ghcr.io/malvavisc0/blitzid:${BLITZID_IMAGE_TAG:-latest}
    ports:
      # Loopback only: the API has no authentication, so a reverse
      # proxy (Caddy/nginx, or the Coolify proxy) must front it with
      # TLS and rate limiting. Do not bind to 0.0.0.0.
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BLITZID_API_REDIS_URL: redis://redis:6379/0
      BLITZID_MODELS_DIR: /models
      # Structured extraction and tracing switch on when these are set;
      # empty leaves those engines off and /health says so.
      BLITZID_LLM_BASE_URL: ${BLITZID_LLM_BASE_URL:-}
      BLITZID_LLM_API_KEY: ${BLITZID_LLM_API_KEY:-}
      BLITZID_LLM_MODEL: ${BLITZID_LLM_MODEL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      BLITZID_API_MAX_UPLOAD_MB: ${BLITZID_API_MAX_UPLOAD_MB:-10}
      BLITZID_API_JOB_TTL_SECONDS: ${BLITZID_API_JOB_TTL_SECONDS:-900}
      BLITZID_API_MAX_QUEUED_JOBS: ${BLITZID_API_MAX_QUEUED_JOBS:-100}
      BLITZID_API_MAX_CONCURRENT_JOBS: ${BLITZID_API_MAX_CONCURRENT_JOBS:-5}
      BLITZID_API_JOB_LEASE_SECONDS: ${BLITZID_API_JOB_LEASE_SECONDS:-120}
    # Engines (~2 GB) + 5 workers + overhead; a leak dies in the
    # cgroup instead of OOMing the box.
    mem_limit: 8g
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      # Five engines load at startup; give the first probe more slack.
      start_period: 30s
      retries: 3
    # Weights persistence: the image bakes every engine's weights into
    # /models, so a volume is optional. Enable it to share one copy
    # across future replicas or to swap weights without rebuilding the
    # image. With the mount on an empty volume, run
    #   docker compose run --rm api python scripts/download_models.py
    # once to populate it; otherwise keep the baked /models as-is.
    volumes:
      - blitzid-models:/models
  redis:
    image: redis:8-alpine
    # Persistence off: jobs live in RAM only — nothing ever reaches disk.
    # Hard memory cap as backpressure: 100 queued × 10 MB uploads plus
    # running jobs stays under the cap; past it, noeviction makes new
    # writes fail, which surfaces as clean 503 + Retry-After at the API
    # instead of an OOM kill.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "noeviction",
      ]
    # Compose network only: no ports exposed, Redis unreachable from
    # the host or internet.
    mem_limit: 2.5g
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

# Named volume for the engine weights (SCRFD, ArcFace, FairFace,
# MiniFASNet, RapidOCR) — survives image swaps and container
# recreation, shared by any future replicas.
volumes:
  blitzid-models: {}
