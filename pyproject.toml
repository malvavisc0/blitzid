[project]
name = "blitzid"
version = "0.5.0"
description = "Modular DNN-based ID document reading framework (face detection, OCR, MRZ) optimized for CPU deployment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Malvavisc0" },
]
keywords = [
    "mrz",
    "ocr",
    "face-detection",
    "id-document",
    "icao-9303",
    "yunet",
    "sface",
    "onnx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

# ── Core dependencies (always installed) ───────────────────
dependencies = [
    "numpy",
    "onnxruntime",
    "opencv-python-headless>=5",
    "platformdirs",
    # Structured-output models (ExtractedField, StructuredOCR) are
    # exported from the package root, so pydantic is a core dependency.
    "pydantic",
    # OCR / MRZ and the LLM-backed structured reader ship in the core
    # install; they are not optional features.
    "rapidocr",
    "pydantic-ai>=2.71",
    "httpx2",
    "langfuse",
    # PDF417 decoding for AAMVA driver's-license payloads.
    "zxing-cpp",
    # Used by scripts/download_models.py to pre-fetch RapidOCR weights.
    "omegaconf",
]

# ── Optional dependency groups ─────────────────────────────
[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "redis",
    # Hosted API-key store (api/_auth.py), used only when
    # BLITZID_API_AUTH_REQUIRED=1 and lazy-imported there. LGPL-3.0-only
    # (linking is permitted; noted in THIRD_PARTY_NOTICES.md); actively
    # maintained by the psycopg org; CPU-only client plus connection
    # pool. Alternative considered: SQLAlchemy — a heavier ORM the auth
    # path does not need (three fixed SQL statements).
    "psycopg[binary]",
    "psycopg-pool",
    # PDF page rasterization for small multi-page uploads. BSD-3-Clause
    # (pypdfium2 + PDFium); actively maintained; CPU-only rendering;
    # lazy-imported in api/_pdf.py. Alternative considered: PyMuPDF
    # (AGPL, incompatible with the self-hosted Enterprise image).
    "pypdfium2",
]
scripts = [
    "tqdm",
    # api_smoke.py's in-process job store double (scripts/ diagnostics).
    "fakeredis",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "tqdm",
    "types-tqdm",
    "pypdfium2",
    # API test deps: fastapi TestClient (httpx), the API extra's
    # request-parsing and store libraries, and a Redis double.
    "fastapi",
    "httpx",
    "python-multipart",
    "redis",
    "fakeredis",
]
all = [
    "blitzid[api,scripts,dev]",
]

# ── Build system ───────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# rapidocr requires the GUI `opencv-python`; we already ship
# `opencv-python-headless` (same `cv2` module), so drop the duplicate.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
packages = ["src/blitzid"]

# The website is a separate application with its own lockfile, tests, static
# assets, and local SQLite databases; it is not part of the Python package.
# Excluding it also keeps locally ignored files (web/web.db, ci.db,
# generated openapi.json/scalar.js) out of PyPI sdists.
[tool.hatch.build.targets.sdist]
exclude = ["web"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "blitzid/THIRD_PARTY_NOTICES.md"
"LICENSES" = "blitzid/LICENSES"

# ── Project URLs ───────────────────────────────────────────
[project.urls]
Homepage = "https://github.com/malvavisc0/blitzid"
Repository = "https://github.com/malvavisc0/blitzid"
Issues = "https://github.com/malvavisc0/blitzid/issues"

# ── Tool configs ───────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["blitzid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Lazy/optional imports (PIL in _image.py, rapidocr in ocr.py,
# pydantic-ai + httpx2 in structurize.py, langfuse + opentelemetry in
# _observability.py, pypdfium2 in api/_pdf.py). rapidocr, zxing-cpp, and
# pypdfium2 have no type stubs; PIL and the observability stack are only
# present in some installs.
module = [
    "PIL",
    "PIL.*",
    "rapidocr",
    "rapidocr.*",
    "zxingcpp",
    "pypdfium2",
    "pypdfium2.*",
    "pydantic_ai",
    "pydantic_ai.*",
    "httpx2",
    "langfuse",
    "langfuse.*",
    "opentelemetry.*",
]
ignore_missing_imports = true
