[project]
name = "blitzid"
version = "0.3.1"
description = "Modular DNN-based ID document reading framework (face detection, OCR, MRZ) optimized for CPU deployment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Malvavisc0" },
]
keywords = [
    "mrz",
    "ocr",
    "face-detection",
    "id-document",
    "icao-9303",
    "scrfd",
    "onnx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

# ── Core dependencies (always installed) ───────────────────
dependencies = [
    "numpy",
    "onnxruntime",
    "opencv-python-headless>=5",
    "platformdirs",
    # Structured-output models (ExtractedField, StructuredOCR) are
    # exported from the package root, so pydantic is a core dependency.
    "pydantic",
]

# ── Optional dependency groups ─────────────────────────────
[project.optional-dependencies]
ocr = [
    "rapidocr",
    # LLM-backed structured extraction from OCR output.
    "pydantic-ai",
    # Optional: Langfuse tracing of the LLM calls (env-gated).
    "langfuse",
]
api = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "redis",
]
scripts = [
    "tqdm",
    # api_smoke.py's in-process job store double (scripts/ diagnostics).
    "fakeredis",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "tqdm",
    "types-tqdm",
    # API test deps: fastapi TestClient (httpx), the API extra's
    # request-parsing and store libraries, and a Redis double.
    "fastapi",
    "httpx",
    "python-multipart",
    "redis",
    "fakeredis",
]
all = [
    "blitzid[api,ocr,scripts,dev]",
]

# ── Build system ───────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# rapidocr requires the GUI `opencv-python`; we already ship
# `opencv-python-headless` (same `cv2` module), so drop the duplicate.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
packages = ["src/blitzid"]

# ── Project URLs ───────────────────────────────────────────
[project.urls]
Homepage = "https://github.com/malvavisc0/blitzid"
Repository = "https://github.com/malvavisc0/blitzid"
Issues = "https://github.com/malvavisc0/blitzid/issues"

# ── Tool configs ───────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["blitzid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Optional user-installed dependencies, lazy-imported inside guarded
# methods (PIL in _image.py, rapidocr in ocr.py, pydantic-ai in
# structurize.py, langfuse + opentelemetry in _observability.py):
# absent in core-only installs, so there is nothing to type-check
# against there.
module = [
    "PIL",
    "PIL.*",
    "rapidocr",
    "rapidocr.*",
    "pydantic_ai",
    "pydantic_ai.*",
    "langfuse",
    "langfuse.*",
    "opentelemetry.*",
]
ignore_missing_imports = true
